# 本地「加密 broker」：帳密＋TLS，用來在筆電上模擬雲端 broker（jetbot-line-notify 任務五）
#
# 與雲端 broker 相同的連線方式（8883、TLS、帳密），差別只在憑證是自簽的，
# 用戶端要用 JETBOT_MQTT_CA_CERTS 指到 certs/ca.crt。憑證與密碼檔由 setup.sh 產生，不進版控。

listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
