# 車外筆電上的 Mosquitto 設定（jetbot-line-notify 任務一）
#
# ⚠️ 僅限區網（手機熱點）測試使用：
#    Mosquitto 2.x 預設只聽本機、拒絕匿名。這裡刻意開放所有網卡的 1883 並允許匿名，
#    讓車上的 sender.py 不需帳密就能連進來。熱點內任何裝置都能收發，
#    請勿在公開網路或對外開放的環境使用這份設定。

listener 1883 0.0.0.0
allow_anonymous true

# 資料是每秒覆蓋的即時狀態，不需要保存
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
